<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona Studio: phone mockup</title>
<style>
  /* The phone page, as Orca's phone browser tab shows it: the Mac draws it, taps arrive as clicks.
     So: plain clicks with big targets, the page scrolls (never a box inside it), sheets instead of menus, no <select>. */
  :root { color-scheme: light dark;
    --bg: #ffffff; --fg: #18181b; --panel: #ffffff; --soft: #f4f4f5; --dim: #6b6b76; --line: #e4e4e7;
    --strong: #18181b; --on-strong: #fafafa; --hover: #ececef; --red: #c81e1e; --blue: #1d4ed8; --amber: #a15c07; --green: #15803d; --focus: #2563eb; --r: 10px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0b0b0c; --fg: #f4f4f5; --panel: #131315; --soft: #1d1d20; --dim: #a1a1aa; --line: #2a2a2e;
    --strong: #f4f4f5; --on-strong: #18181b; --hover: #27272b; --red: #f87171; --blue: #7aa7ff; --amber: #f0b045; --green: #4ade80; --focus: #7aa7ff; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .page { max-width: 640px; margin: 0 auto; padding: 0 16px 120px; }
  .dim { color: var(--dim); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line);
    border-radius: var(--r); background: var(--panel); cursor: pointer; text-align: center; }
  .btn.primary { background: var(--strong); color: var(--on-strong); border-color: transparent; font-weight: 600; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.danger { color: var(--red); }
  .btn.wide { width: 100%; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 8px 16px; display: flex; gap: 8px; }
  header .btn { flex: 1; min-width: 0; justify-content: space-between; }
  header .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 12px 0; }
  .tabs button { min-height: 52px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); cursor: pointer; display: grid; place-items: center; padding: 4px 2px; font-size: 13px; }
  .tabs button b { font-size: 18px; line-height: 1.1; }
  .tabs button[aria-pressed="true"] { background: var(--strong); color: var(--on-strong); border-color: transparent; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .filters .btn { min-height: 40px; padding: 6px 12px; font-size: 14px; }
  .filters .btn[aria-pressed="true"] { border-color: var(--fg); font-weight: 600; }
  .search { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); margin-bottom: 8px; }
  .banner { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 8px 12px; border-radius: var(--r); background: var(--soft); margin-bottom: 8px; }

  .row { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
  .row .tick { width: 52px; flex: none; display: grid; place-items: center; cursor: pointer; }
  .row .tick input { width: 22px; height: 22px; margin: 0; cursor: pointer; }
  .row .open { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 12px 4px 12px 0; cursor: pointer; }
  .row .open b { display: block; font-weight: 600; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: 13px; color: var(--dim); align-items: center; }
  .chip { display: inline-flex; padding: 0 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--fg); background: var(--panel); }
  .chip.strong { background: var(--fg); color: var(--bg); border-color: transparent; font-weight: 600; }
  .chip.bug { color: var(--red); } .chip.missing { color: var(--blue); } .chip.polish { color: var(--amber); }
  .empty { padding: 32px 0; text-align: center; color: var(--dim); }

  .bulk { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px; }
  .bulk .inner { max-width: 608px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bulk .inner > b { flex: 1 0 100%; font-size: 14px; }
  .bulk .btn { flex: 1; }
  .notice { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 7; max-width: 608px; margin: 0 auto; display: flex; gap: 8px; align-items: center;
    padding: 10px 12px; border-radius: var(--r); background: var(--strong); color: var(--on-strong); }
  .notice p { margin: 0; flex: 1; }
  .notice .btn { min-height: 40px; background: transparent; color: inherit; border-color: currentColor; }
  .bulk:not([hidden]) ~ .notice { bottom: 140px; }
  [hidden] { display: none !important; }

  .back { margin: 8px 0 0 -8px; }
  h1 { font-size: 20px; line-height: 1.3; margin: 8px 0 4px; }
  h2 { font-size: 16px; margin: 20px 0 8px; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
  .card { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 12px; margin-bottom: 10px; }
  .card ol { margin: 6px 0; padding-left: 22px; }
  .shot { display: block; width: 100%; border: 1px solid var(--line); border-radius: calc(var(--r) - 4px); padding: 0; background: none; cursor: pointer; margin-top: 8px; }
  .shot svg { display: block; width: 100%; height: auto; }
  textarea { width: 100%; min-height: 120px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); display: block; }
  .saved { font-size: 13px; margin-top: 4px; }
  .history { font-size: 14px; padding-left: 18px; color: var(--dim); }

  .stages { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .stages span { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .stages span.on { background: var(--fg); color: var(--bg); border-color: transparent; }
  .stages span.done { color: var(--fg); }
  .log { margin: 0; padding-left: 18px; font-size: 14px; color: var(--dim); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; }
  .goal { display: flex; gap: 8px; justify-content: space-between; align-items: baseline; }
  .ok { color: var(--green); font-weight: 600; } .no { color: var(--dim); font-weight: 600; }

  /* Sheets: full width from the top, never placed against their button, never scrolled inside. */
  dialog { border: 0; padding: 0; margin: 0 auto; width: 100%; max-width: 640px; max-height: none; background: var(--bg); color: var(--fg); }
  dialog[open] { position: absolute; top: 0; }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  .sheet { padding: 12px 16px 20px; border-bottom: 1px solid var(--line); }
  .sheet h3 { margin: 4px 0 10px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
  .pick { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; min-height: 56px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r);
    background: var(--panel); margin-bottom: 6px; cursor: pointer; }
  .pick[aria-current="true"] { border-color: var(--fg); }
  .pick .who { flex: 1; min-width: 0; }
  .pick .who small { display: block; color: var(--dim); font-size: 13px; }
  .av { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-weight: 600; flex: none; }
  .radio { display: flex; gap: 12px; align-items: center; min-height: 48px; padding: 0 4px; cursor: pointer; }
  .radio input { width: 22px; height: 22px; margin: 0; }
  .field { display: block; margin: 10px 0; }
  .field span { display: block; font-size: 14px; margin-bottom: 4px; }
  .field input { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); }
  .dfoot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .brief { border: 1px solid var(--line); border-radius: var(--r); padding: 10px; font-size: 13px; white-space: pre-wrap; background: var(--soft); }
  #log { font: 12px ui-monospace, monospace; color: var(--dim); margin-top: 24px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="page" id="app"></div>
<div class="bulk" id="bulk" hidden></div>
<div class="notice" id="notice" hidden></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

<script>
const projects = [{ id: 'studio-sample', name: 'studio-sample' }, { id: 'phosphor', name: 'phosphor' }, { id: 'persona-loop', name: 'persona-loop' }]
const personas = [
  { id: 'kai', name: 'Kai', tag: 'keyboard only', state: 'idle', runs: 1, fresh: 4,
    who: ['Kai is a developer who never reaches for the mouse. He lives in his keyboard shortcuts and expects every app to keep up.'],
    goals: [{ text: 'Add a task with one key press after typing its title.', met: false, value: 3, target: 1, unit: 'keys' }, { text: 'Get in and out of Settings from the keys.', met: false }] },
  { id: 'rosa', name: 'Rosa', tag: 'mouse, in a hurry', state: 'running', runs: 0, fresh: 0, stage: 'Using the app', line: 'Step 4 of 9: Searching for "milk"',
    lines: ['Preparing: building dist', 'Started the app on port 4211', 'Step 2 of 9: Adding three tasks', 'Step 3 of 9: Ticking two off', 'Step 4 of 9: Searching for "milk"'],
    who: ['Rosa runs a small shop and fits her to-do list in between customers. She uses the mouse and has no patience for waiting.'],
    goals: [{ text: 'Search answers in under a second.', met: false, value: null, target: 1000, unit: 'ms' }] }]
let findings = [
  { id: 'f1', title: 'Clear completed does nothing', kind: 'bug', sev: 'major', state: 'new', by: ['kai'], steps: ['Tick two tasks', 'Press Clear completed'], expected: 'The ticked tasks go away.', actual: 'Nothing happens.' },
  { id: 'f2', title: 'Settings traps the keyboard', kind: 'bug', sev: 'major', state: 'new', by: ['kai'], steps: ['Press Settings', 'Press Escape', 'Press Tab a few times'], expected: 'Escape closes it.', actual: 'Escape does nothing; Tab cycles the theme options only.' },
  { id: 'f3', title: 'Enter in Title doesn’t add the task', kind: 'missing', sev: 'minor', state: 'new', by: ['kai'], steps: ['Type a title', 'Press Enter'], expected: 'The task is added.', actual: 'Nothing. Only Add adds it.' },
  { id: 'f4', title: 'The logo has no alt text', kind: 'polish', sev: 'polish', state: 'new', by: ['kai'], steps: ['Read the page with a screen reader'], expected: 'It says Tasks.', actual: 'It says image.' },
  { id: 'f5', title: 'An empty title clears the notes too', kind: 'bug', sev: 'minor', state: 'kept', by: ['kai'], steps: ['Type notes', 'Press Add with no title'], expected: 'Only the error shows.', actual: 'The notes are gone.' },
  { id: 'f6', title: 'Search takes three seconds', kind: 'polish', sev: 'minor', state: 'kept', by: ['kai'], steps: ['Type in Search'], expected: 'Results right away.', actual: 'Searching… for three seconds.' }]
const STATES = [['new', 'New'], ['kept', 'Kept'], ['progress', 'Working'], ['fixed', 'Fixed'], ['closed', 'Closed']]
const KINDS = [['all', 'All'], ['bug', 'Bugs'], ['missing', 'Missing'], ['polish', 'Polish']]
const REASONS = ["Won't fix", 'Not a bug', 'Duplicate', "Can't reproduce"]
const ui = { project: 'studio-sample', tab: 'new', persona: null, kind: 'all', q: '', picked: [], view: 'list', open: null, notes: {}, undo: null }
const nameOf = (id) => personas.find((p) => p.id === id)?.name ?? id
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const shown = () => findings.filter((f) => f.state === ui.tab && (!ui.persona || f.by.includes(ui.persona)) && (ui.kind === 'all' || f.kind === ui.kind)
  && (!ui.q || f.title.toLowerCase().includes(ui.q.toLowerCase())))
const count = (s) => findings.filter((f) => f.state === s && (!ui.persona || f.by.includes(ui.persona))).length
const statusOf = (p) => p.state === 'running' ? `${p.stage} · ${p.line.replace(/^Step (\d+) of (\d+): /, '$1/$2 · ')}` : (p.tag)

function header() {
  const p = ui.persona ? nameOf(ui.persona) : 'Everyone'
  return `<header><button class="btn" data-do="projects"><span>${esc(ui.project)}</span>▾</button><button class="btn" data-do="personas"><span>${esc(p)}</span>▾</button></header>`
}
function listView() {
  const tabs = `<div class="tabs">${STATES.map(([s, w]) => `<button data-do="tab" data-tab="${s}" aria-pressed="${ui.tab === s}"><b>${count(s)}</b>${w}</button>`).join('')}</div>`
  const only = ui.persona ? `<div class="banner"><span>Only <b>${esc(nameOf(ui.persona))}</b>'s findings</span><button class="btn" data-do="persona-page">${esc(nameOf(ui.persona))}'s page</button></div>` : ''
  const filters = `<input class="search" type="search" data-field="q" placeholder="Search findings" value="${esc(ui.q)}">`
    + `<div class="filters">${KINDS.map(([k, w]) => `<button class="btn" data-do="kind" data-kind="${k}" aria-pressed="${ui.kind === k}">${w}</button>`).join('')}</div>`
  const rows = shown().map((f) => `<div class="row"><label class="tick"><input type="checkbox" data-do="pick" data-id="${f.id}"${ui.picked.includes(f.id) ? ' checked' : ''} aria-label="Select: ${esc(f.title)}"></label>`
    + `<button class="open" data-do="open" data-id="${f.id}"><b>${esc(f.title)}</b><span class="meta"><span class="chip ${f.sev === 'major' ? 'strong' : ''}">${f.sev}</span><span class="chip ${f.kind}">${f.kind}</span>${f.by.map(nameOf).join(', ')}</span></button></div>`).join('')
  return `${header()}${tabs}${only}${filters}${rows || `<div class="empty"><b>Nothing here</b></div>`}<div id="log"></div>`
}
function detailView() {
  const f = findings.find((x) => x.id === ui.open)
  const acts = f.state === 'new' ? [['discuss', 'Discuss'], ['keep', 'Keep'], ['group-with', 'Group with…'], ['close', 'Close…']]
    : f.state === 'kept' ? [['start', 'Start work…'], ['discuss', 'Discuss'], ['issue', 'Make issue…'], ['close', 'Close…']] : [['reopen', 'Reopen']]
  const notes = ui.notes[f.id] ?? ''
  return `${header()}<button class="btn ghost back" data-do="back">‹ Back to ${STATES.find(([s]) => s === ui.tab)[1]}</button>
    <h1>${esc(f.title)}</h1><div class="meta"><span class="chip ${f.kind}">${f.kind}</span><span class="chip ${f.sev === 'major' ? 'strong' : ''}">${f.sev}</span>${STATES.find(([s]) => s === f.state)[1]}</div>
    <div class="acts">${acts.map(([d, w]) => `<button class="btn${d === 'close' ? ' danger' : ''}${d === 'keep' || d === 'start' ? ' primary' : ''}" data-do="${d}">${w}</button>`).join('')}</div>
    <h2>What ${esc(f.by.map(nameOf).join(' and '))} saw</h2>
    <div class="card"><b>Steps</b><ol>${f.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol><p><b>Expected:</b> ${esc(f.expected)}</p><p><b>Actually:</b> ${esc(f.actual)}</p>
      <button class="shot" data-do="zoom" aria-label="Screenshot, full size">${shotSvg(f.title)}</button></div>
    <h2>Your notes</h2><textarea data-field="notes" placeholder="How to fix it, what it connects to, anything whoever does the work should know.">${esc(notes)}</textarea>
    <div class="saved dim" id="saved">${notes ? 'Saved' : 'What you decide in Discuss lands here too.'}</div>
    <h2>History</h2><ul class="history"><li>Reported by ${esc(f.by.map(nameOf).join(', '))} · 18 Nov</li></ul><div id="log"></div>`
}
function personaView() {
  const p = personas.find((x) => x.id === ui.persona)
  const STAGES = ['Preparing', 'Using the app', 'Writing up', 'Matching']
  const stage = STAGES.indexOf(p.stage)
  const card = p.state === 'running'
    ? `<div class="card"><b><i class="dot"></i>Running</b> <span class="dim">· in its own copy · port 4211</span><div class="stages">${STAGES.map((s, i) => `<span class="${i === stage ? 'on' : i < stage ? 'done' : ''}">${s}</span>`).join('')}</div>
       <ul class="log">${p.lines.slice(-5).map((l) => `<li>${esc(l)}</li>`).join('')}</ul></div>`
    : `<div class="card"><b>${p.runs ? 'Idle' : 'Never run'}</b> <span class="dim">· ${p.runs ? 'last ran yesterday · 1 run so far' : 'Its first run starts from its persona file and goals.'}</span></div>`
  const acts = p.state === 'running' ? `<button class="btn" data-do="watch">Watch the run</button><button class="btn danger" data-do="stop">Stop</button>`
    : `<button class="btn primary" data-do="run">${p.runs ? 'Run again…' : 'Run'}</button><button class="btn" data-do="edit-persona">Edit persona</button>`
  const goals = p.goals.map((g) => `<div class="card"><div class="goal"><span>${esc(g.text)}</span><span class="${g.met ? 'ok' : 'no'}">${g.met ? 'Met' : 'Not met'}</span></div>`
    + (g.value != null ? `<div class="dim">${g.value} ${g.unit} · target: at most ${g.target} ${g.unit}</div>${chartSvg(g)}` : '') + '</div>').join('')
  return `${header()}<button class="btn ghost back" data-do="back">‹ Back to the findings</button><h1>${esc(p.name)}</h1><p class="dim" style="margin:0">${esc(p.tag)}</p>
    ${card}<div class="acts">${acts}</div><button class="btn wide" data-do="only">Show only ${esc(p.name)}'s findings</button>
    <h2>Who</h2>${p.who.map((w) => `<p>${esc(w)}</p>`).join('')}<h2>Goals</h2>${goals}<div id="log"></div>`
}
function shotSvg(title) {
  return `<svg viewBox="0 0 320 180" role="img"><rect width="320" height="180" fill="var(--soft)"/><rect x="20" y="20" width="280" height="28" rx="4" fill="var(--panel)" stroke="var(--line)"/>
    <text x="30" y="39" font-size="12" fill="var(--dim)">Tasks</text><rect x="20" y="60" width="200" height="14" rx="3" fill="var(--line)"/><rect x="20" y="84" width="160" height="14" rx="3" fill="var(--line)"/>
    <rect x="20" y="130" width="120" height="30" rx="5" fill="var(--panel)" stroke="var(--red)" stroke-width="2"/><text x="32" y="150" font-size="12" fill="var(--fg)">Clear completed</text></svg>`
}
function chartSvg(g) {
  return `<svg viewBox="0 0 320 120" role="img" style="width:100%;height:auto;margin-top:8px"><path d="M34 20V98H310" fill="none" stroke="var(--line)"/>
    <line x1="34" y1="92" x2="310" y2="92" stroke="var(--dim)" stroke-dasharray="4 3"/><text x="38" y="88" font-size="10" fill="var(--dim)">target ${g.target}</text>
    <circle cx="172" cy="30" r="4" fill="var(--blue)"/><text x="172" y="22" font-size="11" font-weight="600" text-anchor="middle" fill="var(--fg)">${g.value}</text>
    <text x="172" y="113" font-size="10" text-anchor="middle" fill="var(--dim)">1</text><text x="30" y="113" font-size="10" text-anchor="end" fill="var(--dim)">run</text></svg>`
}

function draw() {
  const app = document.getElementById('app')
  app.innerHTML = ui.view === 'detail' ? detailView() : ui.view === 'persona' ? personaView() : listView()
  const k = ui.picked.length, bulk = document.getElementById('bulk')
  bulk.hidden = !(k && ui.view === 'list')
  bulk.innerHTML = `<div class="inner"><b>${k} selected</b><button class="btn" data-do="group">Group</button>`
    + (ui.tab === 'new' ? '<button class="btn" data-do="bulk-keep">Keep</button>' : '') + (ui.tab === 'kept' ? '<button class="btn" data-do="bulk-work">Start work…</button>' : '')
    + (ui.tab === 'new' || ui.tab === 'kept' ? '<button class="btn danger" data-do="bulk-close">Close…</button>' : '') + '<button class="btn ghost" data-do="unpick" aria-label="Clear selection">✕</button></div>'
  const n = document.getElementById('notice')
  n.hidden = !ui.notice
  if (ui.notice) n.innerHTML = `<p>${esc(ui.notice)}</p>${ui.undo ? '<button class="btn" data-do="undo">Undo</button>' : ''}<button class="btn" data-do="dismiss" aria-label="Dismiss">✕</button>`
  drawLog()
}
function say(text, undo) { ui.notice = text; ui.undo = undo ?? null; draw() }
function sheet(html) { const d = document.getElementById('dlg'); d.innerHTML = `<div class="sheet">${html}</div>`; d.showModal(); window.scrollTo(0, 0) }
const shut = () => document.getElementById('dlg').close()
const foot = (label) => `<div class="dfoot"><button class="btn" data-do="cancel">Cancel</button><button class="btn primary" data-do="submit">${label}</button></div>`

function act(d, el) {
  const f = findings.find((x) => x.id === ui.open)
  switch (d) {
    case 'projects': return sheet(`<h3 id="dlg-title">Project <button class="btn ghost" data-do="cancel">Done</button></h3>`
      + projects.map((p) => `<button class="pick" data-do="project" data-id="${p.id}" aria-current="${p.id === ui.project}"><span class="who"><b>${esc(p.name)}</b></span></button>`).join(''))
    case 'project': ui.project = el.dataset.id; shut(); return draw()
    case 'personas': return sheet(`<h3 id="dlg-title">Personas <button class="btn ghost" data-do="cancel">Done</button></h3>`
      + `<button class="pick" data-do="persona" data-id="" aria-current="${!ui.persona}"><span class="av">∗</span><span class="who"><b>Everyone</b><small>All findings</small></span></button>`
      + personas.map((p) => `<button class="pick" data-do="persona" data-id="${p.id}" aria-current="${ui.persona === p.id}"><span class="av">${p.name[0]}</span><span class="who"><b>${esc(p.name)}</b>`
        + `<small>${p.state === 'running' ? '<i class="dot"></i>' : ''}${esc(statusOf(p))}${p.fresh ? ` · ${p.fresh} New` : ''}</small></span></button>`).join('')
      + `<button class="btn wide" data-do="run-all" style="margin-top:6px">Run all idle</button>`)
    case 'persona': ui.persona = el.dataset.id || null; ui.view = ui.persona ? 'persona' : 'list'; ui.picked = []; shut(); return draw()
    case 'persona-page': ui.view = 'persona'; return draw()
    case 'only': ui.view = 'list'; return draw()
    case 'run-all': shut(); return say('Started Kai. Rosa is already running.')
    case 'tab': ui.tab = el.dataset.tab; ui.picked = []; return draw()
    case 'kind': ui.kind = el.dataset.kind; return draw()
    case 'pick': ui.picked = el.checked ? [...ui.picked, el.dataset.id] : ui.picked.filter((x) => x !== el.dataset.id); return draw()
    case 'unpick': ui.picked = []; return draw()
    case 'open': ui.open = el.dataset.id; ui.view = 'detail'; draw(); return window.scrollTo(0, 0)
    case 'back': ui.view = 'list'; draw(); return window.scrollTo(0, 0)
    case 'keep': { const was = f.state; f.state = 'kept'; ui.view = 'list'; return say('Kept.', () => { f.state = was }) }
    case 'bulk-keep': { const ids = [...ui.picked]; ids.forEach((id) => { findings.find((x) => x.id === id).state = 'kept' }); ui.picked = []
      return say(`Kept ${ids.length}.`, () => ids.forEach((id) => { findings.find((x) => x.id === id).state = 'new' })) }
    case 'close': case 'bulk-close': {
      ui.closing = d === 'close' ? [f.id] : [...ui.picked]
      return sheet(`<h3 id="dlg-title">${ui.closing.length > 1 ? `Close ${ui.closing.length} findings` : 'Close this finding'}</h3>`
        + REASONS.map((r, i) => `<label class="radio"><input type="radio" name="reason" value="${r}"${i ? '' : ' checked'}>${r}</label>`).join('')
        + `<label class="field"><span>Why? (optional)</span><input type="text" id="why" autocomplete="off"></label>${foot('Close')}`)
    }
    case 'start': case 'bulk-work': {
      const ids = d === 'start' ? [f.id] : [...ui.picked]; ui.working = ids
      return sheet(`<h3 id="dlg-title">${ids.length > 1 ? `Start work on ${ids.length} findings` : 'Start work'}</h3>`
        + (ids.length > 1 ? `<label class="radio"><input type="radio" name="how" value="together" checked>One worktree for all of them</label><label class="radio"><input type="radio" name="how" value="each">A worktree for each</label>` : '')
        + `<label class="field"><span>Worktree and branch</span><input type="text" value="${ids.length > 1 ? `fix-${ids.join('-')}` : 'empty-title-clears-notes'}"></label><label class="field"><span>Starts from</span><input type="text" value="main"></label>`
        + `<div class="field"><span>The agent is told</span><div class="brief">You are fixing ${ids.length > 1 ? `${ids.length} findings` : 'one finding'} from Persona Studio…</div></div>${foot('Start work')}`)
    }
    case 'run': return sheet(`<h3 id="dlg-title">Run Kai again</h3><p>Kai first rechecks 1 fix merged since the last run, then looks for what's new.</p>`
      + `<label class="field"><span>Anything to focus on? (optional)</span><textarea id="focus"></textarea></label>${foot('Run')}`)
    case 'zoom': return sheet(`<h3 id="dlg-title">Screenshot <button class="btn ghost" data-do="cancel">Done</button></h3>${shotSvg('')}`)
    case 'submit': {
      shut()
      if (ui.closing) { const ids = ui.closing; ui.closing = null; const r = document.querySelector('input[name=reason]:checked')?.value ?? REASONS[0]
        const was = ids.map((id) => [id, findings.find((x) => x.id === id).state]); ids.forEach((id) => { findings.find((x) => x.id === id).state = 'closed' })
        ui.picked = ui.picked.filter((x) => !ids.includes(x)); ui.view = 'list'
        return say(`Closed${ids.length > 1 ? ` ${ids.length}` : ''} as "${r}".`, () => was.forEach(([id, s]) => { findings.find((x) => x.id === id).state = s })) }
      if (ui.working) { const ids = ui.working; ui.working = null; ids.forEach((id) => { findings.find((x) => x.id === id).state = 'progress' }); ui.picked = []; ui.view = 'list'
        return say(ids.length > 1 ? `Started work on ${ids.length} findings.` : 'Started empty-title-clears-notes. Its chat is in that worktree.') }
      return say('Started Kai’s run.')
    }
    case 'cancel': return shut()
    case 'undo': ui.undo?.(); ui.notice = null; ui.undo = null; return draw()
    case 'dismiss': ui.notice = null; return draw()
    case 'discuss': return say('Started a discussion. It’s the chat "Discuss: ' + f.title + '".')
    case 'group': case 'group-with': case 'issue': case 'reopen': case 'watch': case 'stop': case 'edit-persona':
      return say(`(${d} isn’t in this mockup)`)
  }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-do]')
  if (!el) return
  if (el.dataset.do !== 'pick') e.preventDefault()
  act(el.dataset.do, el)
})
document.addEventListener('input', (e) => {
  const k = e.target.dataset?.field
  if (k === 'q') { ui.q = e.target.value; const at = e.target.selectionStart; draw(); const s = document.querySelector('.search'); s.focus(); s.setSelectionRange(at, at) }
  if (k === 'notes') { ui.notes[ui.open] = e.target.value; document.getElementById('saved').textContent = 'Saving…'; clearTimeout(ui.t); ui.t = setTimeout(() => { const s = document.getElementById('saved'); if (s) s.textContent = 'Saved' }, 800) }
})

// What reaches the page, once per kind, shown at the bottom and sent to the Mac's log.
const seen = []
function drawLog() { const l = document.getElementById('log'); if (l) l.textContent = seen.length ? 'Reached the page: ' + seen.join(', ') : '' }
for (const t of ['pointerdown', 'touchstart', 'click', 'wheel', 'scroll', 'keydown', 'input', 'beforeinput', 'compositionstart'])
  addEventListener(t, (ev) => { const s = t + (ev.pointerType ? `(${ev.pointerType})` : ''); if (seen.includes(s)) return; seen.push(s); drawLog(); fetch('/saw?' + encodeURIComponent(s)).catch(() => {}) }, { capture: true, passive: true })
fetch('/saw?' + encodeURIComponent(`size ${innerWidth}x${innerHeight} dpr ${devicePixelRatio}`)).catch(() => {})
draw()
</script>
</body>
</html>
